services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dg
      POSTGRES_USER: dg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dg"]
      interval: 5s
      retries: 10
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://dg:${POSTGRES_PASSWORD}@db:5432/dg
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes: [uploads:/data/storage]
volumes:
  pgdata:
  uploads:
